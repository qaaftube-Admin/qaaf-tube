<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Asma-ul-Husna ASMR Coloring — QAAF Games</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Dancing+Script:wght@700&family=Fredoka:wght@600;700&family=Inter:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'KFGQPC Uthman Taha Naskh';
      src: local('KFGQPC Uthman Taha Naskh'), local('UthmanicHafs'), local('Amiri');
      font-display: swap;
    }
    @font-face {
      font-family: 'Jameel Noori Nastaleeq';
      src: local('Jameel Noori Nastaleeq'), local('Jameel Noori Nastaleeq Regular'), local('Noto Nastaliq Urdu');
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #ffffff;
      color: #111827;
      font-family: 'Fredoka', 'Inter', sans-serif;
      touch-action: none;
    }

    .font-quran {
      font-family: 'Amiri', 'Scheherazade New', 'KFGQPC Uthman Taha Naskh', serif;
    }
    .font-urdu {
      font-family: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif;
      line-height: 1.9 !important;
      direction: rtl;
    }

    /* Original QAAF Horizontal Toolbar Circular Buttons (Under LEVEL Title) */
    .top-bar-circle-btn {
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      border: 2.5px solid #1e293b;
      box-shadow: 0 3px 0 #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      background: #ffffff;
    }
    .top-bar-circle-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1e293b;
    }

    /* Bottom 4 Circular Color Swatches (Round Circles + 4th Mix Color) */
    .color-circle-btn {
      width: 72px;
      height: 72px;
      border-radius: 9999px;
      border: 4px solid #111827;
      box-shadow: 0 6px 0 #111827, 0 8px 15px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 400px) {
      .color-circle-btn {
        width: 62px;
        height: 62px;
      }
    }
    .color-circle-btn.selected-swatch {
      transform: translateY(-10px) scale(1.08);
      box-shadow: 0 12px 0 #111827, 0 14px 22px rgba(0,0,0,0.14);
    }
    .color-circle-btn:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #111827;
    }

    /* Gallery Card */
    .gallery-item-card {
      background: #ffffff;
      border-radius: 24px;
      border: 3px solid #cbd5e1;
      border-bottom: 8px solid #94a3b8;
      position: relative;
      transition: transform 0.1s ease;
    }
    .gallery-item-card:active {
      transform: scale(0.97);
    }

    @keyframes pulseSpeaker {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }
    .speaking-pulse {
      animation: pulseSpeaker 0.7s infinite ease-in-out;
      background-color: #fde047 !important;
    }
  </style>
</head>
<body class="bg-white">

  <!-- =========================================================================
       MAIN SINGLE-VIEWPORT WHITE SCREEN (ORIGINAL QAAF HEADER + ROUND SWATCHES)
       ========================================================================= -->
  <div id="mainScreen" class="w-full h-full relative flex flex-col justify-between items-center bg-white overflow-hidden">

    <!-- Subtle Light Islamic Arch Filigree Watermark at Top Corners (Copyright-safe original touch) -->
    <svg class="absolute top-0 left-0 w-28 h-28 text-amber-500/10 pointer-events-none" viewBox="0 0 100 100" fill="currentColor">
      <path d="M0,0 L100,0 C60,15 15,60 0,100 Z"/>
    </svg>
    <svg class="absolute top-0 right-0 w-28 h-28 text-emerald-500/10 pointer-events-none" viewBox="0 0 100 100" fill="currentColor">
      <path d="M100,0 L0,0 C40,15 85,60 100,100 Z"/>
    </svg>

    <!-- FULL-BLEED INTERACTIVE CALLIGRAPHY CANVAS IN THE CENTER -->
    <div class="absolute inset-0 flex items-center justify-center z-0 pointer-events-auto">
      <div class="relative w-full h-full max-w-[680px] max-h-[680px] flex items-center justify-center">
        <canvas id="artCanvas" width="960" height="960" class="w-full h-full object-contain touch-none block"></canvas>
        <canvas id="penCanvas" width="960" height="960" class="w-full h-full object-contain pointer-events-none absolute inset-0 block"></canvas>
      </div>
    </div>

    <!-- TOP CENTER HEADER: "LEVEL X" + HORIZONTAL PILL TOOLBAR RIGHT BELOW IT -->
    <div class="w-full max-w-md mx-auto px-3 pt-2.5 flex flex-col items-center z-20 pointer-events-none">

      <!-- Row 1: Level Badge + Speaker Button -->
      <div class="flex items-center gap-2.5 pointer-events-auto">
        <span class="text-amber-500 text-lg">🌙</span>
        <h1 id="txtLevelTitle" class="text-2xl sm:text-3xl font-extrabold tracking-wider text-slate-900">
          LEVEL 1
        </h1>
        <button id="btnPlayVoice" type="button" class="w-9 h-9 rounded-full bg-amber-200 border-2 border-slate-900 shadow-[0_3px_0_#111827] flex items-center justify-center text-base active:translate-y-0.5" title="Listen Name">
          🔊
        </button>
      </div>

      <!-- Row 2: Sleek Horizontal Pill Toolbar Directly Under LEVEL Title -->
      <div class="mt-2 px-3 py-1.5 rounded-full bg-slate-50/90 backdrop-blur-xs border-2 border-slate-200 shadow-xs flex items-center justify-center gap-2.5 pointer-events-auto">
        <!-- Gallery Button -->
        <button id="btnGallery" type="button" class="top-bar-circle-btn bg-[#e0f2fe]" title="Gallery">
          <svg class="w-5 h-5 text-[#0369a1]" fill="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="3" width="8" height="8" rx="2"/>
            <rect x="13" y="3" width="8" height="8" rx="2"/>
            <rect x="3" y="13" width="8" height="8" rx="2"/>
            <rect x="13" y="13" width="8" height="8" rx="2"/>
          </svg>
        </button>

        <!-- Direct Tool Switcher (Marker -> Brush -> Fine Pen -> Gold Pen) -->
        <button id="btnCycleTool" type="button" class="top-bar-circle-btn bg-[#ffedd5]" title="Switch Pen / Brush">
          <span id="iconActiveTool" class="text-xl leading-none">🖍️</span>
        </button>

        <!-- Direct Thickness Dot Switcher -->
        <button id="btnCycleSize" type="button" class="top-bar-circle-btn bg-[#fef9c3]" title="Pen Size">
          <span id="iconActiveSize" class="rounded-full bg-slate-900 block" style="width: 16px; height: 16px;"></span>
        </button>

        <!-- Reset Button -->
        <button id="btnResetArt" type="button" class="top-bar-circle-btn bg-[#ffe4e6]" title="Restart">
          <svg class="w-5 h-5 text-[#be123c]" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>

        <!-- Next Level Button -->
        <button id="btnNextLevel" type="button" class="top-bar-circle-btn bg-[#fce7f3]" title="Next Level">
          <svg class="w-5 h-5 text-[#be185d]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M5.5 5.5v13l7-6.5-7-6.5zm7 0v13l7-6.5-7-6.5z"/>
          </svg>
        </button>

        <!-- Exit Button -->
        <button id="btnExitHub" type="button" class="top-bar-circle-btn bg-[#f1f5f9]" title="Exit">
          <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Meaning Reveal Pill (Appears only after completion) -->
      <div id="meaningRevealPill" class="hidden mt-2 px-4 py-1 rounded-full bg-amber-50 border-2 border-slate-900 shadow-xs text-center pointer-events-auto">
        <span id="txtRevealedName" class="text-xs sm:text-sm font-extrabold text-slate-900">Ar-Rahman • الرَّحْمٰنُ</span>
        <span class="mx-1 text-slate-400">|</span>
        <span id="txtRevealedMeaning" class="text-xs sm:text-sm font-bold text-emerald-700 font-urdu">بڑا مہربان • The Most Gracious</span>
      </div>

    </div>

    <!-- BOTTOM FLOATING BAR: 4 ROUND COLOR CIRCLES (3 SOLID + 4TH DUAL-COLOR MIX) + SHUFFLE -->
    <div class="w-full max-w-lg mx-auto px-3 pb-5 flex items-center justify-center gap-3 sm:gap-4 z-20 pointer-events-none">
      <!-- Circle 1: Solid Color 1 -->
      <button id="swatch0" type="button" class="color-circle-btn selected-swatch pointer-events-auto" style="background-color: #38bdf8;" aria-label="Color 1"></button>
      <!-- Circle 2: Solid Color 2 -->
      <button id="swatch1" type="button" class="color-circle-btn pointer-events-auto" style="background-color: #facc15;" aria-label="Color 2"></button>
      <!-- Circle 3: Solid Color 3 -->
      <button id="swatch2" type="button" class="color-circle-btn pointer-events-auto" style="background-color: #4ade80;" aria-label="Color 3"></button>
      <!-- Circle 4: Dual-Color MIX Swatch (دوہرا مکس کلر) -->
      <button id="swatch3" type="button" class="color-circle-btn pointer-events-auto" style="background: linear-gradient(135deg, #f43f5e 0%, #f43f5e 48%, #fbbf24 52%, #fbbf24 100%);" aria-label="Mix Color">
        <span class="px-1.5 py-0.5 rounded-full bg-white/90 border border-slate-900 text-[10px] font-extrabold text-slate-900 shadow-2xs">MIX</span>
      </button>
      <!-- Shuffle Colors Button -->
      <button id="btnMoreColors" type="button" class="top-bar-circle-btn pointer-events-auto bg-gradient-to-tr from-rose-400 via-amber-300 to-sky-400 w-11 h-11" title="Change Colors">
        <span class="text-lg">🎨</span>
      </button>
    </div>

  </div>

  <!-- =========================================================================
       FULLSCREEN CELEBRATION PETALS & ISLAMIC STARS OVERLAY CANVAS
       (Flowers, Crescents & Stars gently rain from top and settle at the bottom!)
       ========================================================================= -->
  <canvas id="celebrationRainCanvas" width="960" height="960" class="fixed inset-0 w-full h-full pointer-events-none z-55"></canvas>

  <!-- =========================================================================
       SCREEN 2: GALLERY
       ========================================================================= -->
  <div id="screenGallery" class="hidden fixed inset-0 z-40 bg-[#fafaf5] flex-col overflow-hidden">
    <div class="relative bg-gradient-to-r from-emerald-600 via-teal-600 to-sky-600 pt-4 pb-8 px-4 flex items-center justify-between shadow-md">
      <button id="btnBackFromGallery" type="button" class="w-14 h-11 rounded-full bg-amber-400 border-3 border-[#111827] shadow-[0_4px_0_#111827] flex items-center justify-center active:translate-y-1">
        <svg class="w-7 h-7 text-slate-900" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>

      <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide drop-shadow">
        Noor Gallery
      </h2>

      <button id="btnUnlockProGallery" type="button" class="px-3 py-1.5 rounded-xl bg-amber-300 border-2 border-slate-900 shadow-[0_3px_0_#111827] font-extrabold text-xs text-slate-900">
        👑 99 Names
      </button>

      <svg class="absolute bottom-0 left-0 w-full h-5 text-[#fafaf5]" preserveAspectRatio="none" viewBox="0 0 1200 60" fill="currentColor">
        <path d="M0,60 L0,25 Q60,0 120,25 T240,25 T360,25 T480,25 T600,25 T720,25 T840,25 T960,25 T1080,25 T1200,25 L1200,60 Z"></path>
      </svg>
    </div>

    <div class="flex-1 overflow-y-auto p-4 max-w-lg mx-auto w-full">
      <div id="galleryGrid" class="grid grid-cols-2 gap-4 pb-10"></div>
    </div>
  </div>

  <!-- =========================================================================
       COMPLETION CERTIFICATE CARD STUDIO MODAL
       ========================================================================= -->
  <div id="modalCardCreator" class="hidden fixed inset-0 z-50 bg-black/55 backdrop-blur-xs flex items-center justify-center p-3 overflow-y-auto">
    <div class="bg-white rounded-3xl border-4 border-slate-900 shadow-[0_10px_0_#111827] max-w-md w-full p-4 flex flex-col items-center text-center relative">

      <div class="w-full flex items-center justify-between mb-2 px-1">
        <span id="txtModalNameTitle" class="text-base font-extrabold text-slate-900">
          الرَّحْمٰنُ • Ar-Rahman
        </span>
        <button id="btnReplayCardVoice" type="button" class="px-3 py-1 rounded-full bg-amber-300 border-2 border-slate-900 font-extrabold text-xs flex items-center gap-1 shadow-[0_2px_0_#111827]">
          <span>🔊</span>
          <span>Listen Again</span>
        </button>
      </div>

      <!-- Live Certificate Card Canvas -->
      <div class="w-full max-w-[285px] aspect-[4/5] rounded-2xl overflow-hidden border-4 border-slate-900 shadow-md mb-3 bg-white">
        <canvas id="cardPreviewCanvas" width="800" height="1000" class="w-full h-full block"></canvas>
      </div>

      <!-- Highlighted Child's Name Input Box -->
      <div class="w-full mb-3 p-2.5 rounded-2xl bg-gradient-to-r from-amber-100 via-yellow-50 to-emerald-100 border-3 border-amber-500 shadow-sm text-left">
        <label for="inpArtistName" class="flex items-center justify-between text-xs sm:text-sm font-extrabold text-amber-900 mb-1.5">
          <span>✏️ Type Your Name Here</span>
          <span class="font-urdu text-sm text-emerald-800" style="line-height: 1.4 !important;">یہاں اپنا نام لکھیں</span>
        </label>
        <input id="inpArtistName" type="text" maxlength="24" placeholder="e.g. Abdullah / فاطمہ ..."
               class="w-full px-3.5 py-2.5 rounded-xl border-3 border-slate-900 font-extrabold text-base text-slate-900 bg-white shadow-inner focus:outline-none focus:ring-4 focus:ring-amber-400/70" />
      </div>

      <!-- Card Background Color/Style Picker -->
      <div class="w-full mb-3 text-left">
        <div class="text-xs font-extrabold text-slate-700 mb-1.5">
          🎨 Card Background (کارڈ کا بیک گراؤنڈ):
        </div>
        <div id="cardBgRow" class="grid grid-cols-6 gap-2"></div>
      </div>

      <div class="w-full grid grid-cols-2 gap-2.5">
        <button id="btnDownloadCard" type="button" class="py-2.5 px-3 rounded-2xl bg-amber-400 border-3 border-slate-900 shadow-[0_4px_0_#111827] font-extrabold text-xs sm:text-sm text-slate-900 active:translate-y-1">
          📥 Save Card (PNG)
        </button>
        <button id="btnContinueNextLevel" type="button" class="py-2.5 px-3 rounded-2xl bg-emerald-500 border-3 border-slate-900 shadow-[0_4px_0_#111827] font-extrabold text-xs sm:text-sm text-white active:translate-y-1">
          Next Level ▶
        </button>
      </div>

      <button id="btnDismissCardModal" type="button" class="mt-2.5 text-xs font-bold text-slate-500 hover:text-slate-800 underline">
        Close
      </button>
    </div>
  </div>


  <!-- =========================================================================
       MOBILE-SAFE IMAGE SAVE SHEET (WORKS IN ALL ANDROID WEBVIEWS & IFRAMES)
       ========================================================================= -->
  <div id="modalSaveImageSheet" class="hidden fixed inset-0 z-60 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl border-4 border-slate-900 shadow-2xl max-w-sm w-full p-4 flex flex-col items-center text-center">
      <div class="text-sm font-extrabold text-emerald-700 mb-1">✅ Card Ready! کارڈ تیار ہے</div>
      <div class="text-xs font-bold text-slate-600 mb-2 font-urdu" style="line-height:1.6 !important;">
        اگر خود ڈاؤن لوڈ نہ ہو تو نیچے شیئر بٹن دبائیں یا تصویر پر دبا کر رکھیں (Save Image)
      </div>
      <img id="imgFinalSavePreview" src="" alt="Asma-ul-Husna Card" class="w-full max-w-[260px] rounded-2xl border-3 border-slate-900 shadow-md mb-3 select-auto" style="-webkit-touch-callout: default;" />
      <div class="w-full grid grid-cols-2 gap-2">
        <button id="btnNativeShareCard" type="button" class="py-2.5 px-3 rounded-2xl bg-emerald-500 border-3 border-slate-900 shadow-[0_4px_0_#111827] font-extrabold text-xs text-white active:translate-y-1">
          📤 Share / Save
        </button>
        <button id="btnCloseSaveSheet" type="button" class="py-2.5 px-3 rounded-2xl bg-slate-200 border-3 border-slate-900 shadow-[0_4px_0_#111827] font-extrabold text-xs text-slate-900 active:translate-y-1">
          Done ✓
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 99 NAMES OF ALLAH DATASET & 4-SWATCH PALETTES (3 SOLID + 1 MIX PAIR)

    function playSoftTactileSound(kind) {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const dur = kind === 'brush' ? 0.015 : 0.025;
        const len = Math.floor(audioCtx.sampleRate * dur);
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          ch[i] = (Math.random() * 2 - 1) * (1 - i / len) * (kind === 'brush' ? 0.045 : 0.18);
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const flt = audioCtx.createBiquadFilter();
        flt.type = 'bandpass';
        flt.frequency.value = kind === 'brush' ? 850 : 1350;
        src.connect(flt);
        flt.connect(audioCtx.destination);
        src.start();
      } catch (e) {}
    }

    function fnv1aHash(str) {
      const clean = String(str || '').trim();
      let h = 0x811c9dc5;
      for (let i = 0; i < clean.length; i++) {
        h ^= clean.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      return ('00000000' + h.toString(16)).slice(-8);
    }

          setSpeakerPulse(true);
        };

        sharedAudio.onended = function () {
          if (myToken !== currentPlaybackToken || settled) return;
          settled = true;
          clearTimeout(loadGuard);
          setSpeakerPulse(false);
          if (typeof onDone === 'function') onDone();
        };

        sharedAudio.onerror = finishFail;

        try {
          sharedAudio.src = entry.url;
          sharedAudio.load();
          const playPromise = sharedAudio.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(function (err) {
              if (myToken !== currentPlaybackToken) return;
              clearTimeout(loadGuard);
              if (err && err.name === 'NotAllowedError') {
                needsFirstGestureAudio = true;
                settled = true;
                setSpeakerPulse(false);
                return;
              }
              finishFail();
            });
          }
        } catch (e) {
          finishFail();
        }
      }

      tryNextUrl();
    }

    // =========================================================================
    // 4. CALLIGRAPHY ENGINE + AUTOMATIC HIGH-DIACRITIC (PESH) HEIGHT COMPACTOR
    // =========================================================================
    const SIZE = 960;
    const artCanvas = document.getElementById('artCanvas');
    const artCtx = artCanvas.getContext('2d', { willReadFrequently: true });
    const penCanvas = document.getElementById('penCanvas');
    const penCtx = penCanvas.getContext('2d');
    const rainCanvas = document.getElementById('celebrationRainCanvas');
    const rainCtx = rainCanvas.getContext('2d');

    const paintLayer = document.createElement('canvas');
    paintLayer.width = SIZE;
    paintLayer.height = SIZE;
    const paintCtx = paintLayer.getContext('2d', { willReadFrequently: true });

    const outlineLayer = document.createElement('canvas');
    outlineLayer.width = SIZE;
    outlineLayer.height = SIZE;
    const outlineCtx = outlineLayer.getContext('2d');

    let regionMap = new Uint16Array(SIZE * SIZE);
    let paintedMask = new Uint8Array(SIZE * SIZE);
    let totalPaintablePixels = 0;
    let paintedPixelsCount = 0;
    let levelFinished = false;

    function buildCleanCalligraphyRegions() {
      const item = NAMES_99[state.levelIdx];
      const arName = item[1];
      const cx = SIZE / 2;
      const cy = SIZE / 2;

      regionMap.fill(0);
      paintedMask.fill(0);
      totalPaintablePixels = 0;
      paintedPixelsCount = 0;
      levelFinished = false;
      hasSpokenCurrentLevelStart = false;
      clearCelebrationRain();

      const revealPill = document.getElementById('meaningRevealPill');
      if (revealPill) revealPill.classList.add('hidden');

      paintCtx.clearRect(0, 0, SIZE, SIZE);
      outlineCtx.clearRect(0, 0, SIZE, SIZE);

      const maskCan = document.createElement('canvas');
      maskCan.width = SIZE;
      maskCan.height = SIZE;
      const mCtx = maskCan.getContext('2d', { willReadFrequently: true });

      let fontSize = 330;
      mCtx.font = '700 ' + fontSize + 'px "Amiri", "Scheherazade New", "KFGQPC Uthman Taha Naskh", serif';
      const measuredW = mCtx.measureText(arName).width;
      const targetMaxW = SIZE * 0.84;
      if (measuredW > targetMaxW && measuredW > 0) {
        fontSize = Math.max(150, Math.floor(fontSize * (targetMaxW / measuredW)));
        mCtx.font = '700 ' + fontSize + 'px "Amiri", "Scheherazade New", "KFGQPC Uthman Taha Naskh", serif';
      }

      mCtx.textAlign = 'center';
      mCtx.textBaseline = 'middle';
      mCtx.lineJoin = 'round';
      mCtx.lineCap = 'round';

      mCtx.strokeStyle = '#000000';
      mCtx.lineWidth = 4;
      mCtx.strokeText(arName, cx, cy + 28);
      mCtx.fillStyle = '#000000';
      mCtx.fillText(arName, cx, cy + 28);

      const mData = mCtx.getImageData(0, 0, SIZE, SIZE).data;
      const binaryMask = new Uint8Array(SIZE * SIZE);
      for (let i = 0; i < SIZE * SIZE; i++) {
        if (mData[i * 4 + 3] > 115) {
          binaryMask[i] = 1;
        }
      }

      // 2D Connected-Component Flood Fill (BFS)
      const islandMap = new Int32Array(SIZE * SIZE);
      const islandBounds = [];
      let currentIslandId = 0;
      const bfsQueue = new Int32Array(SIZE * SIZE);

      for (let i = 0; i < SIZE * SIZE; i++) {
        if (binaryMask[i] === 1 && islandMap[i] === 0) {
          currentIslandId++;
          let head = 0, tail = 0;
          bfsQueue[tail++] = i;
          islandMap[i] = currentIslandId;

          let minX = SIZE, maxX = 0, minY = SIZE, maxY = 0, area = 0;

          while (head < tail) {
            const curr = bfsQueue[head++];
            area++;
            const y = Math.floor(curr / SIZE);
            const x = curr - y * SIZE;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;

            if (x > 0 && binaryMask[curr - 1] === 1 && islandMap[curr - 1] === 0) {
              islandMap[curr - 1] = currentIslandId;
              bfsQueue[tail++] = curr - 1;
            }
            if (x < SIZE - 1 && binaryMask[curr + 1] === 1 && islandMap[curr + 1] === 0) {
              islandMap[curr + 1] = currentIslandId;
              bfsQueue[tail++] = curr + 1;
            }
            if (y > 0 && binaryMask[curr - SIZE] === 1 && islandMap[curr - SIZE] === 0) {
              islandMap[curr - SIZE] = currentIslandId;
              bfsQueue[tail++] = curr - SIZE;
            }
            if (y < SIZE - 1 && binaryMask[curr + SIZE] === 1 && islandMap[curr + SIZE] === 0) {
              islandMap[curr + SIZE] = currentIslandId;
              bfsQueue[tail++] = curr + SIZE;
            }
          }

          islandBounds[currentIslandId] = {
            id: currentIslandId,
            minX: minX,
            maxX: maxX,
            minY: minY,
            maxY: maxY,
            width: maxX - minX + 1,
            height: maxY - minY + 1,
            area: area
          };
        }
      }

      // =====================================================================
      // NEW: AUTOMATIC HIGH-DIACRITIC (PESH / SHADDAH / SUKOON) PULL-DOWN!
      // Any floating upper diacritic island (whose area < 5500 and maxY < cy + 15)
      // that sits too far above the letter/mark beneath it is shifted straight down
      // so the final Pesh (e.g. on الرَّحِيمُ or الْمُعِزُّ) sits neatly near its letter!
      // =====================================================================
      const upperIslands = [];
      for (let islId = 1; islId <= currentIslandId; islId++) {
        const b = islandBounds[islId];
        if (b && b.area >= 25 && b.area < 5500 && b.height < 145 && b.maxY < cy + 20) {
          upperIslands.push(b);
        }
      }
      // Sort from lowest (closest to letter body, e.g. Shaddah) to highest (e.g. Pesh above Shaddah)
      upperIslands.sort(function (a, b) { return b.maxY - a.maxY; });

      upperIslands.forEach(function (b) {
        const islId = b.id;
        // Look straight down in columns [minX - 24 .. maxX + 24] for the nearest pixel of another island below b.maxY
        const colStart = Math.max(0, b.minX - 24);
        const colEnd = Math.min(SIZE - 1, b.maxX + 24);
        let supportTopY = -1;

        for (let y = b.maxY + 1; y < SIZE - 20; y++) {
          for (let x = colStart; x <= colEnd; x++) {
            const otherId = islandMap[y * SIZE + x];
            if (otherId !== 0 && otherId !== islId) {
              supportTopY = y;
              break;
            }
          }
          if (supportTopY !== -1) break;
        }

        // If no pixel was directly below in that narrow band, widen search slightly to catch final letter tail (like م or ن)
        if (supportTopY === -1) {
          const wideStart = Math.max(0, b.minX - 65);
          const wideEnd = Math.min(SIZE - 1, b.maxX + 65);
          for (let y = b.maxY + 1; y < SIZE - 20; y++) {
            for (let x = wideStart; x <= wideEnd; x++) {
              const otherId = islandMap[y * SIZE + x];
              if (otherId !== 0 && otherId !== islId) {
                supportTopY = y;
                break;
              }
            }
            if (supportTopY !== -1) break;
          }
        }

        const desiredGap = 18; // Neat, compact 18px gap above the letter or Shaddah!
        if (supportTopY !== -1 && (supportTopY - b.maxY) > desiredGap + 6) {
          const shiftDown = (supportTopY - b.maxY) - desiredGap;
          // Shift pixels of `islId` down by `shiftDown` in `islandMap` (bottom-to-top to avoid overwriting)
          for (let y = b.maxY; y >= b.minY; y--) {
            for (let x = b.minX; x <= b.maxX; x++) {
              const oldIdx = y * SIZE + x;
              if (islandMap[oldIdx] === islId) {
                islandMap[oldIdx] = 0;
                const newY = Math.min(SIZE - 10, y + shiftDown);
                islandMap[newY * SIZE + x] = islId;
              }
            }
          }
          b.minY += shiftDown;
          b.maxY += shiftDown;
        }
      });

      // Split wide multi-letter connected islands ONLY at narrow baseline ligature bridges
      let nextRegionId = 1;

      for (let islId = 1; islId <= currentIslandId; islId++) {
        const b = islandBounds[islId];
        if (!b || b.area < 25) continue;

        if (b.width > 165 && b.area > 6500) {
          const w = b.width;
          const colSpan = new Int32Array(w);
          const colCount = new Int32Array(w);

          for (let x = b.minX; x <= b.maxX; x++) {
            let topY = -1, botY = -1, cnt = 0;
            for (let y = b.minY; y <= b.maxY; y++) {
              if (islandMap[y * SIZE + x] === islId) {
                if (topY === -1) topY = y;
                botY = y;
                cnt++;
              }
            }
            colSpan[x - b.minX] = (topY !== -1) ? (botY - topY + 1) : 9999;
            colCount[x - b.minX] = cnt;
          }

          const margin = Math.max(55, Math.floor(w * 0.22));
          const cutColumns = [];
          let xOffset = margin;

          while (xOffset < w - margin) {
            if (colSpan[xOffset] <= 36 && colCount[xOffset] <= 34) {
              let bestX = xOffset;
              let minSpan = colSpan[xOffset];
              const winEnd = Math.min(w - margin, xOffset + 45);
              for (let k = xOffset; k < winEnd; k++) {
                if (colSpan[k] < minSpan) {
                  minSpan = colSpan[k];
                  bestX = k;
                }
              }
              cutColumns.push(b.minX + bestX);
              xOffset = bestX + 75;
            } else {
              xOffset++;
            }
          }

          const numSubRegions = cutColumns.length + 1;
          const baseRegionId = nextRegionId;
          nextRegionId += numSubRegions;

          for (let y = b.minY; y <= b.maxY; y++) {
            for (let x = b.minX; x <= b.maxX; x++) {
              const idx = y * SIZE + x;
              if (islandMap[idx] === islId) {
                let subIdx = 0;
                for (let c = 0; c < cutColumns.length; c++) {
                  if (x > cutColumns[c]) subIdx = c + 1;
                }
                regionMap[idx] = baseRegionId + subIdx;
              }
            }
          }
        } else {
          const rId = nextRegionId++;
          for (let y = b.minY; y <= b.maxY; y++) {
            for (let x = b.minX; x <= b.maxX; x++) {
              const idx = y * SIZE + x;
              if (islandMap[idx] === islId) {
                regionMap[idx] = rId;
              }
            }
          }
        }
      }

      // Build Crisp Dark Black Outlines
      const outImg = outlineCtx.createImageData(SIZE, SIZE);
      const outData = outImg.data;
      const edgeR = 3;

      for (let y = edgeR; y < SIZE - edgeR; y++) {
        for (let x = edgeR; x < SIZE - edgeR; x++) {
          const idx = y * SIZE + x;
          const rId = regionMap[idx];
          if (rId === 0) continue;

          const nUp = regionMap[(y - edgeR) * SIZE + x];
          const nDn = regionMap[(y + edgeR) * SIZE + x];
          const nLt = regionMap[y * SIZE + (x - edgeR)];
          const nRt = regionMap[y * SIZE + (x + edgeR)];

          const isOuterEdge = (nUp === 0 || nDn === 0 || nLt === 0 || nRt === 0);
          const isJointEdge = (
            (nLt > 0 && nLt !== rId) ||
            (nRt > 0 && nRt !== rId)
          );

          if (isOuterEdge || isJointEdge) {
            const p = idx * 4;
            outData[p] = 17;
            outData[p + 1] = 24;
            outData[p + 2] = 39;
            outData[p + 3] = 255;
          } else {
            totalPaintablePixels++;
          }
        }
      }
      outlineCtx.putImageData(outImg, 0, 0);

      const initImg = paintCtx.createImageData(SIZE, SIZE);
      const initData = initImg.data;
      for (let i = 0; i < SIZE * SIZE; i++) {
        if (regionMap[i] > 0) {
          const p = i * 4;
          initData[p] = 248;
          initData[p + 1] = 250;
          initData[p + 2] = 252;
          initData[p + 3] = 255;
        }
      }
      paintCtx.putImageData(initImg, 0, 0);

      document.getElementById('txtLevelTitle').textContent = 'LEVEL ' + item[0];
      renderArtCanvas();
    }

    // =========================================================================
    // 5. GENTLE ISLAMIC FLORAL, CRESCENT & STAR RAIN THAT SETTLES AT BOTTOM
    // =========================================================================
    let rainItems = [];
    let rainActive = false;

    function clearCelebrationRain() {
      rainItems = [];
      rainActive = false;
      rainCtx.clearRect(0, 0, SIZE, SIZE);
    }

    function startGentleIslamicRain() {
      rainItems = [];
      rainActive = true;
      const itemColors = ['#fbbf24', '#f43f5e', '#38bdf8', '#10b981', '#a855f7', '#fb923c'];
      const types = ['flower', 'star8', 'crescent', 'flower'];

      // 42 lightweight delicate items falling gently and stacking along the bottom
      for (let i = 0; i < 42; i++) {
        const colSlot = (i % 14);
        const targetX = 60 + colSlot * 64 + (Math.random() * 26 - 13);
        const layerRow = Math.floor(i / 14);
        const restY = SIZE - 28 - layerRow * 22 - (Math.random() * 10);

        rainItems.push({
          x: targetX,
          y: -30 - Math.random() * 420,
          vy: 2.2 + Math.random() * 1.8,
          vx: (Math.random() - 0.5) * 0.7,
          swayPhase: Math.random() * Math.PI * 2,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.03,
          size: 13 + (i % 3) * 4,
          color: itemColors[i % itemColors.length],
          type: types[i % types.length],
          restY: restY,
          settled: false
        });
      }
    }

    function drawRainShape(ctx, item) {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rot);
      ctx.fillStyle = item.color;
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;

      const s = item.size;
      if (item.type === 'flower') {
        // Cute 5-petal Islamic Jasmine/Rose Blossom
        for (let p = 0; p < 5; p++) {
          const ang = (p * Math.PI * 2) / 5;
          ctx.beginPath();
          ctx.arc(Math.cos(ang) * (s * 0.55), Math.sin(ang) * (s * 0.55), s * 0.45, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.32, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (item.type === 'star8') {
        // 8-Point Islamic Rub el Hizb Star
        ctx.beginPath();
        for (let k = 0; k < 16; k++) {
          const r = k % 2 === 0 ? s : s * 0.48;
          const a = (k * Math.PI) / 8;
          const px = Math.cos(a) * r;
          const py = Math.sin(a) * r;
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        // Golden Crescent Moon
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.85, 0.25 * Math.PI, 1.75 * Math.PI, false);
        ctx.arc(s * 0.35, 0, s * 0.68, 1.65 * Math.PI, 0.35 * Math.PI, true);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function updateAndRenderRain() {
      if (!rainActive) return;
      rainCtx.clearRect(0, 0, SIZE, SIZE);

      for (let i = 0; i < rainItems.length; i++) {
        const it = rainItems[i];
        if (!it.settled) {
          it.swayPhase += 0.04;
          it.x += Math.sin(it.swayPhase) * 0.6 + it.vx;
          it.y += it.vy;
          it.rot += it.vRot;

          // Gently settle and rest at the bottom!
          if (it.y >= it.restY) {
            it.y = it.restY;
            it.settled = true;
          }
        }
        drawRainShape(rainCtx, it);
      }
    }

    // =========================================================================
    // 6. RENDERING & VISUAL PEN / BRUSH ON CANVAS (WITH DUAL-COLOR MIX SUPPORT!)
    // =========================================================================
    let pointer = { x: 500, y: 500, visible: false };

    function renderArtCanvas() {
      artCtx.clearRect(0, 0, SIZE, SIZE);
      artCtx.fillStyle = '#ffffff';
      artCtx.fillRect(0, 0, SIZE, SIZE);
      artCtx.drawImage(paintLayer, 0, 0);
      artCtx.drawImage(outlineLayer, 0, 0);
    }

    function renderPenLayer() {
      penCtx.clearRect(0, 0, SIZE, SIZE);
      updateAndRenderRain();

      if (!pointer.visible || levelFinished) return;

      const tool = TOOLS[state.toolIdx];
      const tipColor = state.isMixMode ? state.activeMixPair[0] : state.activeColor;
      const secondColor = state.isMixMode ? state.activeMixPair[1] : state.activeColor;

      penCtx.save();
      penCtx.translate(pointer.x, pointer.y);
      penCtx.rotate(Math.PI / 4);

      penCtx.fillStyle = 'rgba(0,0,0,0.12)';
      penCtx.beginPath();
      penCtx.roundRect(12, -10, 210, 44, 18);
      penCtx.fill();

      if (tool.id === 'brush') {
        penCtx.fillStyle = tipColor;
        penCtx.strokeStyle = '#111827';
        penCtx.lineWidth = 3.5;
        penCtx.beginPath();
        penCtx.moveTo(0, 0);
        penCtx.quadraticCurveTo(18, -20, 42, -16);
        penCtx.lineTo(42, 16);
        penCtx.quadraticCurveTo(18, 20, 0, 0);
        penCtx.fill();
        penCtx.stroke();

        penCtx.fillStyle = '#cbd5e1';
        penCtx.fillRect(42, -16, 22, 32);
        penCtx.strokeRect(42, -16, 22, 32);

        penCtx.fillStyle = secondColor;
        penCtx.beginPath();
        penCtx.roundRect(64, -14, 165, 28, [0, 14, 14, 0]);
        penCtx.fill();
        penCtx.stroke();
      } else {
        const nibW = tool.id === 'fine' ? 7 : 12;
        penCtx.fillStyle = tipColor;
        penCtx.strokeStyle = '#111827';
        penCtx.lineWidth = 3.5;
        penCtx.beginPath();
        penCtx.moveTo(0, 0);
        penCtx.lineTo(26, -nibW);
        penCtx.lineTo(26, nibW);
        penCtx.closePath();
        penCtx.fill();
        penCtx.stroke();

        penCtx.fillStyle = '#ffffff';
        penCtx.beginPath();
        penCtx.moveTo(26, -nibW);
        penCtx.lineTo(62, -22);
        penCtx.lineTo(62, 22);
        penCtx.lineTo(26, nibW);
        penCtx.closePath();
        penCtx.fill();
        penCtx.stroke();

        penCtx.fillStyle = tipColor;
        penCtx.fillRect(62, -22, 22, 44);
        penCtx.strokeRect(62, -22, 22, 44);

        penCtx.fillStyle = tool.bodyColor;
        penCtx.beginPath();
        penCtx.roundRect(84, -22, 155, 44, [0, 18, 18, 0]);
        penCtx.fill();
        penCtx.stroke();

        penCtx.fillStyle = secondColor;
        penCtx.beginPath();
        penCtx.roundRect(104, -7, 110, 14, 7);
        penCtx.fill();
      }

      penCtx.restore();
    }

    function renderLoop() {
      renderPenLayer();
      requestAnimationFrame(renderLoop);
    }

    // =========================================================================
    // 7. STRICT LETTER-LOCKED BRUSH PAINTING + DUAL-COLOR MIX GRADIENT ENGINE
    // =========================================================================
    let isDrawing = false;
    let lockedRegionId = 0;
    let lastPt = { x: 0, y: 0 };
    let lastSoundTime = 0;

    function getCanvasCoords(evt) {
      const rect = artCanvas.getBoundingClientRect();
      const cx = (evt.touches && evt.touches[0]) ? evt.touches[0].clientX : evt.clientX;
      const cy = (evt.touches && evt.touches[0]) ? evt.touches[0].clientY : evt.clientY;
      return {
        x: Math.max(0, Math.min(SIZE - 1, Math.floor((cx - rect.left) * (SIZE / rect.width)))),
        y: Math.max(0, Math.min(SIZE - 1, Math.floor((cy - rect.top) * (SIZE / rect.height))))
      };
    }

    function findNearestRegion(x, y) {
      const direct = regionMap[y * SIZE + x];
      if (direct > 0) return direct;
      for (let r = 2; r <= 18; r += 2) {
        for (let dy = -r; dy <= r; dy += r) {
          for (let dx = -r; dx <= r; dx += r) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE) {
              const id = regionMap[ny * SIZE + nx];
              if (id > 0) return id;
            }
          }
        }
      }
      return 0;
    }

    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      const n = parseInt(clean, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    // Compute pixel RGB for either Solid Color OR 4th Swatch Dual-Color Mix!
    function getPixelPaintRgb(x, y, rgbSolid, rgbMixA, rgbMixB, isGoldTool) {
      if (isGoldTool && ((x + y) % 7 === 0)) {
        return [254, 240, 138];
      }
      if (!state.isMixMode) {
        return rgbSolid;
      }
      // Smooth spatial dual-color wave so both colors flow out of the pen side by side!
      const wave = 0.5 + 0.5 * Math.sin((x + y) * 0.032);
      return [
        Math.round(rgbMixA[0] * (1 - wave) + rgbMixB[0] * wave),
        Math.round(rgbMixA[1] * (1 - wave) + rgbMixB[1] * wave),
        Math.round(rgbMixA[2] * (1 - wave) + rgbMixB[2] * wave)
      ];
    }

    function paintDabLocked(cx, cy, radius, targetRegionId) {
      if (!targetRegionId) return;
      const rSq = radius * radius;
      const minX = Math.max(0, Math.floor(cx - radius));
      const maxX = Math.min(SIZE - 1, Math.ceil(cx + radius));
      const minY = Math.max(0, Math.floor(cy - radius));
      const maxY = Math.min(SIZE - 1, Math.ceil(cy + radius));
      const w = maxX - minX + 1;
      const h = maxY - minY + 1;

      const img = paintCtx.getImageData(minX, minY, w, h);
      const data = img.data;
      const rgbSolid = hexToRgb(state.activeColor);
      const rgbMixA = hexToRgb(state.activeMixPair[0]);
      const rgbMixB = hexToRgb(state.activeMixPair[1]);
      const isGoldTool = TOOLS[state.toolIdx].id === 'gold';

      for (let y = minY; y <= maxY; y++) {
        const dy = y - cy;
        for (let x = minX; x <= maxX; x++) {
          const dx = x - cx;
          if (dx * dx + dy * dy <= rSq) {
            const gIdx = y * SIZE + x;
            if (regionMap[gIdx] === targetRegionId) {
              const lIdx = ((y - minY) * w + (x - minX)) * 4;
              const c = getPixelPaintRgb(x, y, rgbSolid, rgbMixA, rgbMixB, isGoldTool);
              data[lIdx] = c[0];
              data[lIdx + 1] = c[1];
              data[lIdx + 2] = c[2];
              data[lIdx + 3] = 255;

              if (paintedMask[gIdx] === 0) {
                paintedMask[gIdx] = 1;
                paintedPixelsCount++;
              }
            }
          }
        }
      }
      paintCtx.putImageData(img, minX, minY);
    }

    function snapFinishSingleRegionIfAlmostDone(targetRegionId) {
      if (!targetRegionId) return;
      let totalInReg = 0, paintedInReg = 0;
      for (let i = 0; i < SIZE * SIZE; i++) {
        if (regionMap[i] === targetRegionId) {
          totalInReg++;
          if (paintedMask[i] === 1) paintedInReg++;
        }
      }
      if (totalInReg > 0 && paintedInReg / totalInReg >= 0.80) {
        const img = paintCtx.getImageData(0, 0, SIZE, SIZE);
        const data = img.data;
        const rgbSolid = hexToRgb(state.activeColor);
        const rgbMixA = hexToRgb(state.activeMixPair[0]);
        const rgbMixB = hexToRgb(state.activeMixPair[1]);
        const isGoldTool = TOOLS[state.toolIdx].id === 'gold';

        for (let i = 0; i < SIZE * SIZE; i++) {
          if (regionMap[i] === targetRegionId && paintedMask[i] === 0) {
            const y = Math.floor(i / SIZE);
            const x = i - y * SIZE;
            const c = getPixelPaintRgb(x, y, rgbSolid, rgbMixA, rgbMixB, isGoldTool);
            const p = i * 4;
            data[p] = c[0];
            data[p + 1] = c[1];
            data[p + 2] = c[2];
            data[p + 3] = 255;
            paintedMask[i] = 1;
            paintedPixelsCount++;
          }
        }
        paintCtx.putImageData(img, 0, 0);
        renderArtCanvas();
      }
    }

    function checkWholeWordCompleted() {
      if (levelFinished || totalPaintablePixels === 0) return;
      if (paintedPixelsCount / totalPaintablePixels >= 0.90) {
        const img = paintCtx.getImageData(0, 0, SIZE, SIZE);
        const data = img.data;
        const rgbSolid = hexToRgb(state.activeColor);
        const rgbMixA = hexToRgb(state.activeMixPair[0]);
        const rgbMixB = hexToRgb(state.activeMixPair[1]);
        const isGoldTool = TOOLS[state.toolIdx].id === 'gold';

        for (let i = 0; i < SIZE * SIZE; i++) {
          if (regionMap[i] > 0 && paintedMask[i] === 0) {
            const y = Math.floor(i / SIZE);
            const x = i - y * SIZE;
            const c = getPixelPaintRgb(x, y, rgbSolid, rgbMixA, rgbMixB, isGoldTool);
            const p = i * 4;
            data[p] = c[0];
            data[p + 1] = c[1];
            data[p + 2] = c[2];
            data[p + 3] = 255;
            paintedMask[i] = 1;
          }
        }
        paintCtx.putImageData(img, 0, 0);
        renderArtCanvas();
        onLevelComplete();
      }
    }

    function onPointerDown(evt) {
      if (levelFinished) return;
      evt.preventDefault();

      if (needsFirstGestureAudio || !hasSpokenCurrentLevelStart) {
        needsFirstGestureAudio = false;
        speakLevelStartName();
      }

      const pt = getCanvasCoords(evt);
      isDrawing = true;
      lastPt = pt;
      pointer = { x: pt.x, y: pt.y, visible: true };
      lockedRegionId = findNearestRegion(pt.x, pt.y);

      const rad = getEffectiveRadius();
      paintDabLocked(pt.x, pt.y, rad, lockedRegionId);
      renderArtCanvas();
      playSoftTactileSound('brush');
    }

    function onPointerMove(evt) {
      if (!isDrawing || levelFinished) return;
      evt.preventDefault();
      const pt = getCanvasCoords(evt);
      pointer = { x: pt.x, y: pt.y, visible: true };

      if (!lockedRegionId) {
        lockedRegionId = findNearestRegion(pt.x, pt.y);
      }

      const rad = getEffectiveRadius();
      const dist = Math.hypot(pt.x - lastPt.x, pt.y - lastPt.y);
      const steps = Math.max(1, Math.ceil(dist / (rad * 0.28)));

      for (let s = 1; s <= steps; s++) {
        const t = s / steps;
        paintDabLocked(
          lastPt.x + (pt.x - lastPt.x) * t,
          lastPt.y + (pt.y - lastPt.y) * t,
          rad,
          lockedRegionId
        );
      }
      lastPt = pt;
      renderArtCanvas();

      const now = Date.now();
      if (now - lastSoundTime > 90) {
        lastSoundTime = now;
        playSoftTactileSound('brush');
      }
    }

    function onPointerUp() {
      if (!isDrawing) return;
      isDrawing = false;
      snapFinishSingleRegionIfAlmostDone(lockedRegionId);
      checkWholeWordCompleted();
    }

    function getEffectiveRadius() {
      const base = SIZES[state.sizeIdx].radius;
      const toolId = TOOLS[state.toolIdx].id;
      if (toolId === 'fine') return Math.max(14, Math.round(base * 0.6));
      if (toolId === 'brush') return Math.round(base * 1.25);
      return base;
    }

    function renderKeepsakeCard() {
      const can = document.getElementById('cardPreviewCanvas');
      const ctx = can.getContext('2d');
      const item = NAMES_99[state.levelIdx];
      const th = CARD_THEMES[state.cardThemeIdx % CARD_THEMES.length];

      // 1. Background gradient & outer frame
      const grad = ctx.createLinearGradient(0, 0, 0, 1000);
      grad.addColorStop(0, th.top);
      grad.addColorStop(1, th.bottom);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 800, 1000);

      ctx.strokeStyle = th.border;
      ctx.lineWidth = 14;
      ctx.strokeRect(22, 22, 756, 956);

      // 2. Top Header: Arabic Name • Transliteration
      ctx.fillStyle = th.text;
      ctx.font = 'bold 36px "Amiri", "Fredoka", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(item[1] + '  •  ' + item[2], 400, 84);

      // 3. BIGGER Main White Box: Colored Calligraphy + Urdu & English Meaning directly underneath!
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(58, 110, 684, 608, 38);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#111827';
      ctx.stroke();
      ctx.clip();

      // Colored Sacred Calligraphy centered cleanly in the upper section of the box
      ctx.drawImage(paintLayer, 125, 65, 550, 550);
      ctx.drawImage(outlineLayer, 125, 65, 550, 550);

      // Subtle divider line below calligraphy
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(155, 552);
      ctx.lineTo(645, 552);
      ctx.stroke();

      // Urdu Meaning right beneath the Name
      ctx.textAlign = 'center';
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 38px "Jameel Noori Nastaleeq", "Noto Nastaliq Urdu", serif';
      ctx.fillText(item[4], 400, 616);

      // English Meaning right beneath Urdu
      ctx.fillStyle = th.text;
      ctx.font = 'bold 27px "Inter", sans-serif';
      ctx.fillText(item[3], 400, 672);
      ctx.restore();

      // 4. DEDICATED Bottom Artist Name Box: Small Handwriting "Coloring by" (top-left) + BIG BOLD Child Name!
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.roundRect(58, 738, 684, 148, 30);
      ctx.fill();
      ctx.stroke();

      // Small cursive handwriting label on top-left
      ctx.textAlign = 'left';
      ctx.fillStyle = '#64748b';
      ctx.font = '700 28px "Dancing Script", Georgia, serif';
      ctx.fillText('Coloring by', 92, 774);

      // BIG, BOLD, PROMINENT Child's Name centered below
      const artist = (state.childName || '').trim() || 'Little Artist';
      let nameFontSize = 68;
      ctx.textAlign = 'center';
      ctx.font = '800 ' + nameFontSize + 'px "Fredoka", "Inter", sans-serif';
      while (ctx.measureText(artist).width > 610 && nameFontSize > 38) {
        nameFontSize -= 4;
        ctx.font = '800 ' + nameFontSize + 'px "Fredoka", "Inter", sans-serif';
      }
      ctx.fillStyle = '#059669';
      ctx.fillText(artist, 400, 852);

      // 5. Bottom Islamic Floral, Crescent & Star Garland
      const garlandColors = ['#fbbf24', '#f43f5e', '#38bdf8', '#10b981', '#a855f7'];
      for (let g = 0; g < 11; g++) {
        drawRainShape(ctx, {
          x: 90 + g * 62,
          y: 932 + (g % 2 === 0 ? -4 : 4),
          rot: g * 0.4,
          size: 14,
          color: garlandColors[g % garlandColors.length],
          type: g % 3 === 0 ? 'star8' : (g % 3 === 1 ? 'flower' : 'crescent')
        });
      }
    }

        document.getElementById('modalSaveImageSheet').classList.add('hidden');
      });

      document.getElementById('btnContinueNextLevel').addEventListener('click', function () {
        playSoftTactileSound('click');
        clearCelebrationRain();
        document.getElementById('modalCardCreator').classList.add('hidden');
        state.levelIdx = (state.levelIdx + 1) % NAMES_99.length;
        buildCleanCalligraphyRegions();
        speakLevelStartName();
      });

      document.getElementById('btnDismissCardModal').addEventListener('click', function () {
        clearCelebrationRain();
        document.getElementById('modalCardCreator').classList.add('hidden');
      });
    });
  </script>
</body>
</html>
