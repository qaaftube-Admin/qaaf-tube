<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>قاف گیمز - QAAF Games Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Bebas+Neue&family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/earlyaccess/urdufont.css');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      background-color: #070d17;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 85%, rgba(56, 189, 248, 0.10) 0%, transparent 45%);
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-urdu { font-family: 'Jameel Noori Nastaleeq', 'Urdu Typesetting', 'Noto Nastaliq Urdu', serif; line-height: 2.0; font-weight: normal; direction: rtl; }
    .font-arabic { font-family: 'Noto Naskh Arabic', 'Amiri', serif; line-height: 1.85; direction: rtl; }
    .font-en, .font-english { font-family: 'Inter', 'Fredoka', sans-serif; line-height: 1.45; }
    button.font-urdu { font-family: 'Jameel Noori Nastaleeq', 'Urdu Typesetting', serif; font-weight: bold; }
    .card-3d {
      background: linear-gradient(180deg, #132238 0%, #0c1626 100%);
      border: 1.5px solid rgba(251, 191, 36, 0.22);
      border-bottom: 4px solid #060b13;
      box-shadow: 0 6px 16px -4px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
    }
    .hub-game-bar {
      background: linear-gradient(90deg, #13233a 0%, #0d1829 100%);
      border: 1.5px solid rgba(251, 191, 36, 0.28);
      border-bottom: 3.5px solid #050a12;
      border-radius: 0.9rem;
      transition: all 0.15s ease;
    }
    .hub-game-bar:hover {
      border-color: #fbbf24;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.18);
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="font-urdu">

  <!-- Top Header for Main Hub -->
  <header id="mainHubHeader" class="sticky top-0 z-40 bg-[#070d17]/95 backdrop-blur-md border-b border-slate-800/90 shadow-md">
    <div class="max-w-5xl mx-auto px-3 py-1.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-base sm:text-lg">🎮</span>
        <span id="hubHeaderTitle" class="text-sm sm:text-base font-bold text-amber-300 truncate">قاف گیمز</span>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <div class="bg-amber-500/15 border border-amber-400/50 rounded-lg px-2.5 py-0.5 flex items-center gap-1">
          <span class="text-xs">⭐</span>
          <span id="hubStarCount" class="text-xs font-extrabold text-amber-300 font-english">0</span>
        </div>
        <button onclick="exitToMainQaafApp()" class="bg-rose-600 hover:bg-rose-500 text-white border border-rose-300/60 border-b-2 border-b-rose-900 rounded-lg px-2.5 py-1 text-xs font-bold flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-right-from-bracket text-[10px]"></i>
          <span id="hubExitLabel">باہر نکلیں</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Hub Game List View -->
  <main id="hubListView" class="max-w-xl mx-auto px-3 py-3 space-y-3">
    <div class="card-3d p-3 flex items-center justify-between gap-2 flex-wrap">
      <span id="hubLangPrompt" class="text-xs sm:text-sm font-bold text-amber-300 flex items-center gap-1.5">
        <i class="fa-solid fa-globe text-emerald-400"></i>
        <span>زبان منتخب کریں:</span>
      </span>
      <div class="bg-slate-950/90 p-1 rounded-xl border border-slate-700/80 flex items-center gap-1">
        <button onclick="setHubLanguage('ur')" id="langBtn-ur" class="px-3 py-1 rounded-lg text-xs font-bold bg-amber-400 text-slate-950 font-urdu">اردو</button>
        <button onclick="setHubLanguage('ar')" id="langBtn-ar" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white font-arabic">العربية</button>
        <button onclick="setHubLanguage('en')" id="langBtn-en" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white font-english">English</button>
      </div>
    </div>

    <!-- Dynamic Games Container (Add new games in QAAF_GAMES_LIST below!) -->
    <div id="gamesListContainer" class="space-y-2"></div>
  </main>

  <!-- Fullscreen Embedded Game Frame Container (When a game is opened from games/ folder) -->
  <div id="activeGameFrameContainer" class="hidden fixed inset-0 z-50 bg-[#070d17]">
    <iframe id="activeGameIframe" class="w-full h-full border-0" allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const STORAGE_STARS_KEY = 'qaaf_game_stars';
    const STORAGE_PREF_LANG_KEY = 'qaaf_preferred_lang';

    /**
     * =========================================================================
     * QAAF GAMES REGISTRY (نیا گیم شامل کرنے کے لیے صرف یہاں ایک نئی لائن کا اضافہ کریں!)
     * =========================================================================
     */
    const QAAF_GAMES_LIST = [
      {
        id: 'wordsearch',
        file: 'games/wordsearch.html',
        icon: '🔍',
        badgeBg: 'bg-amber-400/20 border-amber-400/60 text-amber-300',
        playColor: 'text-amber-400',
        title: { ur: 'ورڈ سرچ پزل', ar: 'لغز البحث عن الكلمات', en: 'Word Search Puzzle' }
      },
      {
        id: 'quiz',
        file: 'games/quiz.html',
        icon: '📖',
        badgeBg: 'bg-emerald-400/20 border-emerald-400/60 text-emerald-300',
        playColor: 'text-emerald-400',
        title: { ur: 'قرآن و سنت کوئز', ar: 'مسابقة القرآن والسنة', en: 'Quran & Sunnah Quiz' }
      },
      {
        id: 'alphabet',
        file: 'games/alphabet.html',
        icon: '🔤',
        badgeBg: 'bg-sky-400/20 border-sky-400/60 text-sky-300',
        playColor: 'text-sky-400',
        title: { ur: 'عربی حروف پزل', ar: 'لغز الحروف العربية', en: 'Arabic Alphabet Puzzle' }
      },
      {
        id: 'masjid',
        file: 'games/masjid.html',
        icon: '🕌',
        badgeBg: 'bg-purple-400/20 border-purple-400/60 text-purple-300',
        playColor: 'text-purple-400',
        title: { ur: 'مسجد اور وضو بلڈر', ar: 'بناء المسجد والوضوء', en: 'Masjid & Wudu Builder' }
      },
      {
        id: 'racing',
        file: 'games/racing.html',
        icon: '🏍️',
        badgeBg: 'bg-rose-400/20 border-rose-400/60 text-rose-300',
        playColor: 'text-rose-400',
        title: { ur: 'بائیک ریسنگ', ar: 'سباق الدراجات', en: 'Bike Racing' }
      }
    ];

    let currentLang = 'en';

    const HUB_TEXT = {
      ur: { dir: 'rtl', font: 'font-urdu', title: 'قاف گیمز', langPrompt: 'زبان منتخب کریں:', exit: 'باہر نکلیں' },
      ar: { dir: 'rtl', font: 'font-arabic', title: 'ألعاب قاف', langPrompt: 'اختر اللغة:', exit: 'خروج' },
      en: { dir: 'ltr', font: 'font-english', title: 'QAAF Games', langPrompt: 'Select Language:', exit: 'Exit' }
    };

    function refreshStars() {
      try {
        const s = parseInt(localStorage.getItem(STORAGE_STARS_KEY) || '0', 10);
        document.getElementById('hubStarCount').textContent = isNaN(s) ? 0 : s;
      } catch (e) {}
    }

    function setHubLanguage(lang) {
      if (!['ur', 'ar', 'en'].includes(lang)) lang = 'ur';
      currentLang = lang;
      try { localStorage.setItem(STORAGE_PREF_LANG_KEY, lang); } catch (e) {}

      const t = HUB_TEXT[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      document.body.className = t.font;

      document.getElementById('hubHeaderTitle').textContent = t.title;
      document.getElementById('hubLangPrompt').innerHTML = `<i class="fa-solid fa-globe text-emerald-400"></i><span>${t.langPrompt}</span>`;
      document.getElementById('hubExitLabel').textContent = t.exit;

      ['ur', 'ar', 'en'].forEach(code => {
        const btn = document.getElementById(`langBtn-${code}`);
        const fnt = code === 'ar' ? 'font-arabic' : (code === 'en' ? 'font-english' : 'font-urdu');
        btn.className = code === lang
          ? `px-3 py-1 rounded-lg text-xs font-bold bg-amber-400 text-slate-950 ${fnt}`
          : `px-3 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white ${fnt}`;
      });

      renderGamesList();
    }

    function renderGamesList() {
      const container = document.getElementById('gamesListContainer');
      container.innerHTML = QAAF_GAMES_LIST.map((g, idx) => `
        <button onclick="launchGameFile('${g.id}')" class="hub-game-bar w-full px-3.5 py-2.5 flex items-center justify-between gap-3 text-right">
          <div class="flex items-center gap-3 min-w-0">
            <span class="w-7 h-7 rounded-lg border font-english font-bold text-xs flex items-center justify-center shrink-0 ${g.badgeBg}">${idx + 1}</span>
            <span class="text-xl shrink-0">${g.icon}</span>
            <span class="text-sm sm:text-base font-bold text-white truncate">${g.title[currentLang] || g.title.ur}</span>
          </div>
          <i class="fa-solid fa-play text-xs ${g.playColor} shrink-0"></i>
        </button>
      `).join('');
    }

    function launchGameFile(gameId) {
      const gameObj = QAAF_GAMES_LIST.find(g => g.id === gameId);
      if (!gameObj) return;
      const frameContainer = document.getElementById('activeGameFrameContainer');
      const iframe = document.getElementById('activeGameIframe');
      iframe.src = `${gameObj.file}?game=${gameObj.id}&lang=${currentLang}`;
      frameContainer.classList.remove('hidden');
    }

    function closeGameFileToHub() {
      const frameContainer = document.getElementById('activeGameFrameContainer');
      const iframe = document.getElementById('activeGameIframe');
      iframe.src = 'about:blank';
      frameContainer.classList.add('hidden');
      refreshStars();
    }

    function exitToMainQaafApp() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'QAAF_EXIT_GAMES' }, '*');
        }
      } catch (e) {}
      if (window.history.length > 1) window.history.back();
      else window.location.href = 'index.html';
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'QAAF_BACK_TO_HUB' || data.type === 'QAAF_EXIT_GAMES') {
        closeGameFileToHub();
      } else if (data.type === 'QAAF_STARS_UPDATED') {
        refreshStars();
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(data, '*');
        }
      } else if (data.type === 'QAAF_PRO_UNLOCKED') {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(data, '*');
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      refreshStars();
      let savedLang = 'en';
      try {
        const l = localStorage.getItem(STORAGE_PREF_LANG_KEY);
        if (['ur', 'ar', 'en'].includes(l)) savedLang = l;
      } catch (e) {}
      setHubLanguage(savedLang);

      // Support ?game=racing etc. direct URL launch
      try {
        const params = new URLSearchParams(window.location.search);
        const requested = params.get('game');
        if (requested && QAAF_GAMES_LIST.some(g => g.id === requested)) {
          launchGameFile(requested);
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
