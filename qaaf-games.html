<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QAAF Kids Halal Games Zone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Nastaliq Urdu', sans-serif;
      background: radial-gradient(circle at top, #0f1c2e 0%, #060911 100%);
      color: #fff;
      user-select: none;
      overflow-x: hidden;
    }
    .grid-cell {
      transition: all 0.15s ease;
    }
    .grid-cell:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-5" oncontextmenu="return false;">

  <!-- TOP STAGE & LANGUAGE BAR -->
  <div class="max-w-3xl w-full mx-auto bg-[#111722] border border-slate-700/80 rounded-2xl p-3 sm:p-4 shadow-xl mb-3">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
      <div class="flex items-center gap-2">
        <span id="gIcon" class="text-2xl">🧩</span>
        <div>
          <h1 id="gTitle" class="text-sm sm:text-base font-extrabold text-white">Islamic Word Search Puzzle</h1>
          <p id="gStageText" class="text-[11px] text-emerald-400 font-bold">Stage 1 of 10</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5" id="langSwitchGroup">
        <button onclick="setGameLang('en')" id="btnLang_en" class="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-emerald-500 text-black">🇬🇧 EN</button>
        <button onclick="setGameLang('ar')" id="btnLang_ar" class="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-slate-800 text-slate-300">🇸🇦 AR</button>
        <button onclick="setGameLang('ur')" id="btnLang_ur" class="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-slate-800 text-slate-300">🇵🇰 UR</button>
      </div>
    </div>
    <div class="flex items-center gap-1 overflow-x-auto py-1" id="stageDotsBar"></div>
  </div>

  <!-- MAIN PLAYABLE BOARD -->
  <div id="gameBoardArea" class="max-w-3xl w-full mx-auto flex-1 flex flex-col justify-center"></div>

  <!-- ILLUSTRATED POPUP CARD WHEN WORD IS COMPLETED -->
  <div id="wordRewardModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-gradient-to-b from-[#152232] to-[#0c121b] border-2 border-emerald-400 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl transform transition-all">
      <div id="popupEmoji" class="w-20 h-20 rounded-3xl bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center text-5xl mx-auto mb-3 animate-bounce">🕋</div>
      <h3 id="popupWordTitle" class="text-xl font-extrabold text-white mb-1">MAKKAH</h3>
      <p id="popupWordMeaning" class="text-xs text-emerald-300 font-bold mb-4">MashaAllah! The Blessed City of Kaaba (+1 Star ⭐)</p>
      <button onclick="closeWordRewardModal()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-2.5 rounded-xl text-xs shadow-lg">Continue Playing ▶</button>
    </div>
  </div>

  <!-- BOTTOM STAGE NAV -->
  <div class="max-w-3xl w-full mx-auto mt-3 bg-[#111722] border border-slate-800 rounded-2xl p-3 flex items-center justify-between">
    <button onclick="changeStage(-1)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-extrabold">◀ Previous Stage</button>
    <span id="progressStatusText" class="text-xs font-bold text-amber-300">Tap letters to find words!</span>
    <button onclick="changeStage(1)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-extrabold shadow">Next Stage ▶</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let currentGameId = params.get('id') || 'g4';
    let currentLang = params.get('lang') || 'en';
    if (!['en','ar','ur'].includes(currentLang)) currentLang = 'en';
    let isProUnlocked = params.get('pro') === '1';
    let currentStage = 1;

    const WORD_BANKS = {
      en: [
        { word: "QURAN", icon: "📖", label: "Quran", desc: "The Holy Book of Allah revealed to Prophet Muhammad ﷺ" },
        { word: "MAKKAH", icon: "🕋", label: "Makkah", desc: "The blessed city where the Holy Kaaba is located" },
        { word: "MADINAH", icon: "🕌", label: "Madinah", desc: "The radiant city of the Prophet's Masjid" },
        { word: "SALAH", icon: "🧎", label: "Salah", desc: "The 5 daily prayers of a Muslim" },
        { word: "ZAKAT", icon: "🪙", label: "Zakat", desc: "Sharing wealth with the poor and needy" },
        { word: "SAWM", icon: "🌙", label: "Sawm", desc: "Fasting in the blessed month of Ramadan" },
        { word: "HAJJ", icon: "⛺", label: "Hajj", desc: "Pilgrimage to the House of Allah in Makkah" },
        { word: "DUA", icon: "🤲", label: "Dua", desc: "Calling upon Allah with humility and hope" },
        { word: "WUDU", icon: "💧", label: "Wudu", desc: "Purification with clean water before Salah" },
        { word: "SABR", icon: "🌿", label: "Sabr", desc: "Patience and steadfastness for Allah's sake" }
      ],
      ar: [
        { word: "قران", icon: "📖", label: "قرآن", desc: "كتاب الله الكريم المنزل على نبينا محمد ﷺ" },
        { word: "مكة", icon: "🕋", label: "مكة", desc: "البلد الحرام وموقع الكعبة المشرفة" },
        { word: "مدينة", icon: "🕌", label: "مدينة", desc: "المدينة المنورة ومكان المسجد النبوي" },
        { word: "صلاة", icon: "🧎", label: "صلاة", desc: "عمود الدين والصلوات الخمس المفروضة" },
        { word: "زكاة", icon: "🪙", label: "زكاة", desc: "طهرة للمال وعون للفقراء والمساكين" },
        { word: "صوم", icon: "🌙", label: "صوم", desc: "صيام شهر رمضان المبارك إيماناً واحتساباً" },
        { word: "حج", icon: "⛺", label: "حج", desc: "حج بيت الله الحرام لمن استطاع إليه سبيلاً" },
        { word: "دعاء", icon: "🤲", label: "دعاء", desc: "الدعاء هو العبادة والتضرع إلى الله" },
        { word: "وضوء", icon: "💧", label: "وضوء", desc: "الطهارة والنظافة قبل أداء الصلاة" },
        { word: "صبر", icon: "🌿", label: "صبر", desc: "الصبر مفتاح الفرج ونيل محبة الله" }
      ],
      ur: [
        { word: "قرآن", icon: "📖", label: "قرآن", desc: "اللہ تعالیٰ کی آخری الہامی کتاب" },
        { word: "مکہ", icon: "🕋", label: "مکہ", desc: "خانہ کعبہ کا مقدس شہر مکہ مکرمہ" },
        { word: "مدینہ", icon: "🕌", label: "مدینہ", desc: "مسجدِ نبوی ﷺ کا پیارا شہر مدینہ منورہ" },
        { word: "نماز", icon: "🧎", label: "نماز", desc: "دن میں پانچ وقت کی فرض عبادت" },
        { word: "زکوۃ", icon: "🪙", label: "زکوۃ", desc: "غریبوں اور ناداروں کی مالی مدد" },
        { word: "روزہ", icon: "🌙", label: "روزہ", desc: "رمضان المبارک کے بابرکت روزے" },
        { word: "حج", icon: "⛺", label: "حج", desc: "بیت اللہ شریف کا مقدس سفر اور عبادت" },
        { word: "دعا", icon: "🤲", label: "دعا", desc: "اپنے رب سے مانگنا اور التجاء کرنا" },
        { word: "وضو", icon: "💧", label: "وضو", desc: "نماز سے پہلے پاکیزگی اور صفائی" },
        { word: "صبر", icon: "🌿", label: "صبر", desc: "مشکل وقت میں اللہ کی رضا پر راضی رہنا" }
      ]
    };

    let foundWords = [];
    let selectedCells = [];
    let currentGrid = [];
    let wordPlacements = {};

    function speakArabicOrMsg(txt) {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'ar-SA';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function notifyStarEarned() {
      try { window.parent.postMessage({ type: 'QAAF_GAME_STAR_EARNED' }, '*'); } catch (e) {}
    }

    function setGameLang(l) {
      currentLang = l;
      ['en','ar','ur'].forEach(k => {
        const b = document.getElementById('btnLang_' + k);
        if (b) b.className = k === l ? 'px-2.5 py-1 rounded-lg text-xs font-extrabold bg-emerald-500 text-black' : 'px-2.5 py-1 rounded-lg text-xs font-extrabold bg-slate-800 text-slate-300';
      });
      foundWords = [];
      selectedCells = [];
      buildStage();
    }

    function renderStageDots() {
      const bar = document.getElementById('stageDotsBar');
      bar.innerHTML = '';
      for (let s = 1; s <= 10; s++) {
        const locked = (s > 3 && !isProUnlocked);
        const btn = document.createElement('button');
        btn.className = 'w-7 h-7 rounded-full text-xs font-extrabold shrink-0 flex items-center justify-center transition ' + (s === currentStage ? 'bg-emerald-500 text-black scale-110 shadow' : (locked ? 'bg-amber-950/80 border border-amber-500/40 text-amber-300' : 'bg-slate-800 text-slate-300'));
        btn.innerText = locked ? '🔒' : s;
        btn.onclick = () => { currentStage = s; foundWords = []; selectedCells = []; buildStage(); };
        bar.appendChild(btn);
      }
      document.getElementById('gStageText').innerText = `Stage ${currentStage} of 10`;
    }

    function changeStage(dir) {
      const next = currentStage + dir;
      if (next < 1 || next > 10) return;
      currentStage = next;
      foundWords = [];
      selectedCells = [];
      buildStage();
    }

    function build10x10WordGrid() {
      const size = 10;
      const grid = Array.from({ length: size }, () => Array(size).fill(''));
      wordPlacements = {};
      const bank = WORD_BANKS[currentLang] || WORD_BANKS.en;

      bank.forEach((item, idx) => {
        const chars = Array.from(item.word);
        const row = idx % size;
        const startCol = Math.min(size - chars.length, (idx + currentStage) % Math.max(1, size - chars.length + 1));
        wordPlacements[item.word] = [];
        chars.forEach((ch, cIdx) => {
          const col = startCol + cIdx;
          grid[row][col] = ch;
          wordPlacements[item.word].push(`${row}_${col}`);
        });
      });

      const filler = currentLang === 'en'
        ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')
        : 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!grid[r][c]) {
            grid[r][c] = filler[(r * 7 + c * 3 + currentStage) % filler.length];
          }
        }
      }
      currentGrid = grid;
    }

    function showWordPopup(item) {
      document.getElementById('popupEmoji').innerText = item.icon;
      document.getElementById('popupWordTitle').innerText = item.label;
      document.getElementById('popupWordMeaning').innerText = item.desc;
      document.getElementById('wordRewardModal').classList.remove('hidden');
      speakArabicOrMsg("مَا شَاءَ اللَّه");
    }

    function closeWordRewardModal() {
      document.getElementById('wordRewardModal').classList.add('hidden');
    }

    function tapWordClueCard(wordStr) {
      const bank = WORD_BANKS[currentLang] || WORD_BANKS.en;
      const item = bank.find(x => x.word === wordStr);
      if (!item) return;
      if (!foundWords.includes(wordStr)) {
        foundWords.push(wordStr);
        notifyStarEarned();
        showWordPopup(item);
        renderWordSearchBoard();
      } else {
        showWordPopup(item);
      }
    }

    function tapGridCell(r, c) {
      const key = `${r}_${c}`;
      if (selectedCells.includes(key)) {
        selectedCells = selectedCells.filter(k => k !== key);
      } else {
        selectedCells.push(key);
      }

      const bank = WORD_BANKS[currentLang] || WORD_BANKS.en;
      bank.forEach(item => {
        if (foundWords.includes(item.word)) return;
        const needed = wordPlacements[item.word] || [];
        if (needed.length > 0 && needed.every(k => selectedCells.includes(k))) {
          foundWords.push(item.word);
          selectedCells = selectedCells.filter(k => !needed.includes(k));
          notifyStarEarned();
          showWordPopup(item);
        }
      });

      renderWordSearchBoard();
    }

    function renderWordSearchBoard() {
      const board = document.getElementById('gameBoardArea');
      const bank = WORD_BANKS[currentLang] || WORD_BANKS.en;

      let cluesHtml = '';
      bank.forEach(item => {
        const isDone = foundWords.includes(item.word);
        cluesHtml += `
          <button onclick="tapWordClueCard('${item.word}')" class="p-1.5 rounded-xl border text-center transition flex flex-col items-center justify-center ${isDone ? 'bg-emerald-500/30 border-emerald-400 text-emerald-200' : 'bg-slate-900/90 hover:bg-slate-800 border-slate-700 text-white'}">
            <span class="text-base sm:text-lg">${item.icon}</span>
            <span class="text-[10px] sm:text-xs font-extrabold truncate w-full">${item.label}</span>
          </button>`;
      });

      let allFoundCells = [];
      foundWords.forEach(w => {
        allFoundCells = allFoundCells.concat(wordPlacements[w] || []);
      });

      let gridHtml = '';
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const key = `${r}_${c}`;
          const isFound = allFoundCells.includes(key);
          const isSel = selectedCells.includes(key);
          gridHtml += `
            <button onclick="tapGridCell(${r},${c})" class="grid-cell aspect-square rounded-lg font-extrabold text-xs sm:text-sm flex items-center justify-center border ${isFound ? 'bg-emerald-500 text-black border-emerald-300 shadow' : (isSel ? 'bg-amber-400 text-black border-amber-200 scale-105' : 'bg-[#131b29] hover:bg-slate-800 text-slate-100 border-slate-700/80')}">
              ${currentGrid[r][c]}
            </button>`;
        }
      }

      document.getElementById('progressStatusText').innerText = `Found ${foundWords.length} of 10 Words ⭐`;

      board.innerHTML = `
        <div class="bg-[#0e141f] border border-slate-800 rounded-2xl p-3 sm:p-4 space-y-3 shadow-2xl">
          <div class="grid grid-cols-5 sm:grid-cols-10 gap-1.5">${cluesHtml}</div>
          <div class="grid grid-cols-10 gap-1 sm:gap-1.5 max-w-md mx-auto w-full" dir="${currentLang === 'en' ? 'ltr' : 'rtl'}">${gridHtml}</div>
        </div>
      `;
    }

    function buildStage() {
      renderStageDots();
      const board = document.getElementById('gameBoardArea');
      if (currentStage > 3 && !isProUnlocked) {
        board.innerHTML = `
          <div class="bg-[#111724] border-2 border-amber-500/50 rounded-3xl p-6 text-center max-w-md mx-auto shadow-2xl">
            <div class="text-4xl mb-3">👑</div>
            <h3 class="text-base font-extrabold text-amber-300 mb-2">Stage ${currentStage} is Supporter Pro</h3>
            <p class="text-xs text-slate-300 mb-4">Ask your parents to unlock Stages 4 to 10 using their 6-Digit Parent PIN.</p>
            <button onclick="window.parent.postMessage({ type: 'QAAF_OPEN_PARENT_SUPPORT' }, '*')" class="bg-emerald-500 text-black font-extrabold px-5 py-2.5 rounded-xl text-xs shadow">🔓 Unlock via Parent PIN</button>
          </div>`;
        return;
      }
      build10x10WordGrid();
      renderWordSearchBoard();
    }

    setGameLang(currentLang);
  </script>
</body>
</html>
